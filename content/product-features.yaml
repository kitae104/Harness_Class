    product: ChatGPT
    plan: Plus
    name: 프로젝트 전용 메모리
    status: available
    detail: "프로젝트 전용 메모리를 쓰면 같은 프로젝트의 다른 대화를 참조할 수 있고, 프로젝트 밖 대화는 참조하지 않는다. 평가 결과가 앞선 대화의 영향을 받을 수 있다."
    verified_at: 2026-09-24
    verified_by: web
    source: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
    ui_path: 프로젝트 설정 > 메모리
    fallback: "평가는 새 대화에서 하고, 같은 프로젝트 안의 연습 대화를 평가 전에 정리한다."
    used_in: [d1-eval-run]

