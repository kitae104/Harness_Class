# 제품 정보 등록부 — 변경 가능한 ChatGPT·Codex·Google·Vercel 정보는 여기에만 적는다.
# 본문은 <Feature id="..."/> 또는 docs의 [AS-OF: id] 태그로만 참조한다.
# status: available | limited | unavailable | unverified(= tbd에 OQ 필수)
# verified_by: web(공식 문서 확인) | hands-on(실제 계정으로 확인)
# 관리 정책: docs/PRODUCT_FEATURES.md
features:
  - id: chatgpt-projects
    product: ChatGPT
    plan: Plus
    name: Projects(프로젝트)
    status: available
    detail: "지침과 파일을 묶은 작업 공간. 프로젝트 지침은 그 프로젝트 안에서 전역 맞춤 지침보다 우선한다."
    verified_at: 2026-09-24
    verified_by: web
    source: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
    ui_path: 사이드바 > 새 프로젝트
    fallback: "일반 대화창 첫 메시지에 지침 전문과 근거 발췌를 붙여 넣고 같은 대화 안에서만 실습한다."
    used_in: [d1-project, d1-context, d2-batch-classify, d2-project-build]

  - id: chatgpt-project-file-limit
    product: ChatGPT
    plan: Plus
    name: 프로젝트 파일 개수 한도
    status: available
    detail: "Plus 프로젝트당 파일 25개, 한 번에 10개까지 업로드."
    verified_at: 2026-09-24
    verified_by: web
    source: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
    ui_path: 프로젝트 > 파일 추가
    fallback: "핵심 조문을 모은 요약 파일 1개로 합쳐 올린다."
    used_in: [d1-context, d2-project-build]

  - id: chatgpt-project-sharing
    product: ChatGPT
    plan: Plus
    name: 프로젝트 공유
    status: available
    detail: "Plus는 초대한 사람에게만 공유 가능, 공유 프로젝트는 파일 25개·협업자 10명까지. 공유 프로젝트는 항상 프로젝트 전용 메모리를 쓴다."
    verified_at: 2026-09-24
    verified_by: web
    source: https://help.openai.com/en/articles/10169521-projects-in-chatgpt
    ui_path: 프로젝트 > 공유
    fallback: "지침 전문을 하네스 대장에 복사해 동료에게 전달한다."
    used_in: [d1-project]

