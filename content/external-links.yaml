    kind: sheet-template
    owner: "[TBD: OQ-06]"
    url: null
    verified_at: null
    fallback: 아래 표 양식을 복사해 메모장이나 내 구글 시트에 붙여 넣어 기록합니다(대장 템플릿 준비 전 임시)
    fallback_kind: template
    fallback_templates:
      baseline:
        title: 기준 질문 기록
        columns: [번호, 질문, 답(붙여 넣기), 근거를 밝혔나(예/아니오), 메모]
      sources:
        title: 자료 목록
        columns: [자료명, 기준일, 올린 곳, 메모]
      guideline-versions:
        title: 지침 버전
        columns: [버전, 날짜, 지침 전문, 바꾼 이유]
      before-after:
        title: 적용 전·후 비교
        columns: [번호, 질문, 전 답(붙여 넣기), 후 답(붙여 넣기), 형식·범위 개선(예/아니오), 메모]
      eval:
        title: 평가
        columns: [번호, 질문, 답변 요약, 정확, 출처, 금지, 점수, 틀린 이유]
      revisions:
        title: 개정 기록
        columns: [날짜, 바꾼 곳(지침·근거), 바꾼 내용, 이유(원인·문항 번호), 점수 전, 점수 후]
      classification:
        title: 분류 대장
        columns: [번호, 접수일, 유형(내용 기준), 긴급도, 담당 부서, 한 줄 요약, 확인 필요(예/아니오), 확인 필요 이유(A~E), 비고]
      draft-review:
        title: 초안 검토 기록
        columns: [번호(분류 대장), 초안 표시(통과·문제), 개인정보(통과·문제), 금지 위반(통과·문제), 근거(통과·문제), 검토(승인·수정·보류), 검토 메모, 검토자]
      log:
        title: 로그 대장
        columns: [날짜, 입력(개인정보 없이 한 줄), 답 요약, 출처(조문), 문제(없음·개인정보·숨은 지시문·금지 위반), 검토자, 검토(승인·수정·보류), 지침 버전]
      harness-summary:
        title: 민원 하네스 완성본
        columns: [요소, 담는 곳, 들어 있는 것, 점검(예/아니오)]
      roadmap:
        title: 적용 로드맵
        columns: [단계, 할 일, 확인할 곳·담당, 시기, 완료(예/아니오)]
