# Day 1 공통 키트 — 전입신고 민원 답변 비서 (docs/PRACTICE_CASES.md 1·2절)
# status·reviewed_hash는 content/course.yaml kits에만 둔다(ADR-011).
# 평가 질문과 기대 답변은 파일을 나눈다(CD-17).
id: day1-civil
title: Day 1 전입신고 민원 답변 비서 키트
track: core
sources: [fictional-day1-move-in-rule]
privacy_notes: 실제 이름·연락처·주민등록번호를 AI에 넣지 마세요. 연락처는 010-0000-XXXX 형식의 가상 번호만 씁니다. 실제 업무에서는 실제 법령과 기관 안내를 확인하세요.
fictional_label: 이 자료는 교육용 가상 자료이며 실제 인물·기관과 무관합니다. 누리시 규정과 FAQ는 실제 법령 원문이 아니며 법적 효력이 없는 실습용 합성 자료입니다.
files:
  - path: rule-move-in.md
    role: context
    download: true
    description: 누리시 전입신고 안내 규정(교육용 가상 규정, 제1조~제10조). Project 파일로 올립니다.
  - path: faq-move-in.md
    role: context
    download: true
    description: 누리시 전입신고 FAQ(교육용 FAQ, 항목마다 근거 조문). Project 파일로 올립니다.
  - path: guideline-v0.md
    role: guideline
    download: true
    description: 민원 답변 비서 지침 v0(일부러 단순하게 만든 초안). D1-2에서 v1로 고칩니다.
  - path: instructor-notes.md
    role: other
    download: false
    description: 강사용 설명(D1-1 질문 대응표, 의도된 결함과 보강 항목, 사람 검토 항목)
  - path: eval-questions.md
    role: eval
    download: true
    description: 평가 질문 20문항(질문만, 1~10번과 11~20번 두 번에 나눠 실행). Project 새 대화에 붙여 답을 받습니다(D1-6).
  - path: eval-expected.md
    role: eval
    download: true
    description: 평가 기대 답변 20문항(핵심 포인트 2개 + 근거 조문, 자료에 없음 문항은 확인 필요). 채점 단계에서만 씁니다.
  - path: eval-scoresheet.csv
    role: eval
    download: true
    description: 채점표 양식(교육용 가상 자료, 8열, 20문항 + 직접 작성 3행). 표 파일로 시트에 불러와 씁니다.
