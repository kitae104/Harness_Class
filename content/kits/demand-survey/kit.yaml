# Day 2 예시 키트 — 교육·행사 수요조사 + 결과 보고서 (docs/PRACTICE_CASES.md 1·4절, CD-09·CD-10·CD-23)
# 법령 근거 없음. 가상 양식이 기관 내부 기준 역할을 한다.
# status·reviewed_hash는 content/course.yaml kits에만 둔다(ADR-011).
# 평가 질문과 기대 답변은 파일을 나눈다(CD-17).
# survey-responses.csv는 첫 줄이 열 이름인 가상 응답 20건이다(CSV라 가상 표기 줄을 넣지 않고 여기와 fictional_label에 밝힌다).
id: demand-survey
title: 교육·행사 수요조사 + 결과 보고서 키트
track: core
sources: [fictional-demand-survey-form]
privacy_notes: 수요조사에서 이름·연락처·사번을 묻지 않고, 폼의 이메일 수집은 끕니다. 의견 칸의 연락처·이름·개인 사정은 보고서와 AI에 옮기지 않습니다. 응답이 적은 소속은 "기타"로 묶어 개인을 알아볼 수 없게 합니다. 연락처는 010-0000-XXXX 형식의 가상 번호만 씁니다.
fictional_label: 이 자료는 교육용 가상 자료이며 실제 인물·기관과 무관합니다. 수요조사 양식·보고서 양식·응답(survey-responses.csv)은 모두 법령 근거가 없는 실습용 가상 자료입니다.
files:
  - path: survey-form.md
    role: form-template
    download: true
    description: 직원 교육 수요조사 문항 틀(7문항)과 집계 기준 5개(교육용 가상 양식, 기관 내부 기준 역할). 구글 폼으로 옮기고 Project 파일로도 올립니다.
  - path: report-format.md
    role: context
    download: true
    description: 수요조사 결과 보고서 양식(6절)과 작성 규칙(교육용 가상 양식). Project 파일로 올립니다.
  - path: survey-responses.csv
    role: input-data
    download: true
    description: 가상 수요조사 응답 20건(교육용 가상 자료, 9열, 첫 줄은 열 이름). 채팅에 첨부해 집계합니다. Project 파일로 올리지 않습니다.
  - path: guideline-frame.md
    role: guideline
    download: true
    description: 수요조사 결과 보고서 비서 지침서 5항목 틀(출력 형식·모를 때 행동만 힌트로 채움). D2-5·D2-6에서 완성합니다.
  - path: eval-questions.md
    role: eval
    download: true
    description: 평가 질문 10문항 후보(질문만, 응답 CSV를 첨부해 실행). D2-5에서 고쳐 쓰고 D2-6에서 5문항을 실행합니다.
  - path: eval-expected.md
    role: eval
    download: true
    description: 평가 기대 답변 10문항(핵심 포인트 2개 + 양식 항목, 자료에 없음 문항은 확인 필요). 채점 단계에서만 씁니다.
  - path: instructor-notes.md
    role: other
    download: false
    description: 강사용 설명(키트 쓰임, 응답 데이터 요약과 확인 지점, 문항별 확인 내용, 사람 검토 항목, 강의 준비)
