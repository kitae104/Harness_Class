# Day 2 예시 키트 — 규정 Q&A 비서(인사·복무) (docs/PRACTICE_CASES.md 1·4절, CD-10·CD-12·CD-23)
# status·reviewed_hash는 content/course.yaml kits에만 둔다(ADR-011).
