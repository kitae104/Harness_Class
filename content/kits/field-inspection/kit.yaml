# Day 2 예시 키트 — 현장 점검 보고 폼 + 정리 비서 (docs/PRACTICE_CASES.md 1·4절, CD-09·CD-10·CD-13·CD-23)
# status·reviewed_hash는 content/course.yaml kits에만 둔다(ADR-011).
# 평가 질문과 기대 답변은 파일을 나눈다(CD-17).
# inspection-responses.csv는 첫 줄이 열 이름인 가상 점검 결과 12건이다(CSV라 가상 표기 줄을 넣지 않고 여기와 fictional_label에 밝힌다).
id: field-inspection
title: 현장 점검 보고 폼 + 정리 비서 키트
track: core
sources: [fictional-field-inspection-rule]
privacy_notes: 점검 사진에 사람의 얼굴·차량 번호·집 주소가 찍히지 않게 하고, 찍혔으면 가린 뒤에 씁니다. 주민 이름·연락처는 보고서와 AI에 넣지 않습니다. 사진 문항은 응답자 구글 로그인과 드라이브 저장이 필요하므로 선택으로 둡니다. 폼의 이메일 수집은 끕니다. 연락처는 010-0000-XXXX 형식의 가상 번호만 씁니다.
fictional_label: 이 자료는 교육용 가상 자료이며 실제 인물·기관과 무관합니다. 누리시 시설 안전점검 규정은 실제 법령 원문이 아니며 법적 효력이 없는 실습용 합성 자료이고, 시설명과 점검 결과(inspection-responses.csv)도 모두 가상입니다.
files:
  - path: rule-inspection.md
    role: context
    download: true
    description: 누리시 시설 안전점검 규정(교육용 가상 규정, 제1조~제7조, 점검 항목·등급 기준·긴급 보고·사진 가리기). Project 파일로 올립니다.
  - path: form-template.md
    role: form-template
    download: true
    description: 시설 안전점검 보고 폼 문항 틀(교육용 가상 양식, 12문항, 사진 문항은 선택). 구글 폼으로 옮겨 씁니다.
  - path: inspection-responses.csv
    role: input-data
    download: true
    description: 가상 점검 결과 12건(교육용 가상 자료, 13열, 첫 줄은 열 이름). 채팅에 첨부해 정리합니다. Project 파일로 올리지 않습니다.
  - path: guideline-frame.md
    role: guideline
    download: true
    description: 현장 점검 정리 비서 지침서 5항목 틀(금지사항 일부·모를 때 행동만 힌트로 채움). D2-5·D2-6에서 완성합니다.
  - path: eval-questions.md
    role: eval
    download: true
    description: 평가 질문 10문항 후보(질문만, 점검 결과 CSV를 첨부해 실행). D2-5에서 고쳐 쓰고 D2-6에서 5문항을 실행합니다.
  - path: eval-expected.md
    role: eval
    download: true
    description: 평가 기대 답변 10문항(핵심 포인트 2개 + 근거 조문, 자료에 없음 문항은 확인 필요). 채점 단계에서만 씁니다.
  - path: instructor-notes.md
    role: other
    download: false
    description: 강사용 설명(키트 쓰임, 입력 데이터 확인 지점, 문항별 확인 내용, 사람 검토 항목, 강의 준비)
