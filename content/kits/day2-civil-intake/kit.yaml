# Day 2 오전 공통 키트 — 민원 접수 흐름 (docs/PRACTICE_CASES.md 1·3절)
# day1-civil(전입신고 민원 답변 비서)을 확장한다. 전입신고 조문은 day1-civil의 교육용 가상 규정을 가리킨다.
# status·reviewed_hash는 content/course.yaml kits에만 둔다(ADR-011).
id: day2-civil-intake
title: Day 2 민원 접수·분류·초안 검토 키트
track: core
sources: [fictional-civil-cases, fictional-day1-move-in-rule]
privacy_notes: 실제 이름·연락처·주소·주민등록번호를 폼과 AI에 넣지 마세요. 폼은 이메일 수집을 끄고 이름·상세 주소 문항을 두지 않습니다. 제공 CSV와 역할카드에는 일부러 가상 이름·상세 주소를 넣은 행이 있으니, 채팅에 첨부하기 전에 찾아서 지우고 결과 표에도 옮기지 않습니다. 연락처는 010-0000-XXXX 형식의 가상 번호만 씁니다.
fictional_label: 이 자료는 교육용 가상 자료이며 실제 인물·기관과 무관합니다. 누리시, 누리1동 행정복지센터, 담당 부서와 연락처, 민원인과 민원 내용은 모두 실습용으로 만든 가상 자료입니다. 전입신고 조문은 법적 효력이 없는 교육용 가상 규정입니다.
files:
  - path: form-questions.md
    role: form-template
    download: true
    description: 민원 접수 폼 문항 5개(접수일·민원 유형·내용·희망 회신 방법·연락처)와 이메일 수집 끄기 안내. D2-1에서 구글 폼으로 옮깁니다.
  - path: role-cards.md
    role: input-data
    download: true
    description: 가상 민원인 역할카드 15장. D2-1에서 강사 공용 폼에 카드 3장으로 3번 응답합니다.
  - path: classification-table.md
    role: context
    download: true
    description: 민원 분류 기준표(유형·담당 부서·긴급도·확인 필요·개인정보 처리). D2-2에서 Project 파일로 올립니다.
  - path: civil-requests-30.csv
    role: input-data
    download: true
    description: 가상 민원 30건(교육용 가상 자료, 실제 인물·기관과 무관, 5열은 폼 문항과 같음, 개인정보가 든 행 포함). 공용 폼 응답이 부족할 때 D2-2에서 채팅에 첨부합니다.
  - path: review-criteria.md
    role: guideline
    download: true
    description: 답변 초안 검토 기준(승인·수정·보류, "초안·검토 필요" 표시, 과태료 금액 단정·개인정보 옮김). D2-3에서 사람이 옆에 두고 씁니다.
  - path: attack-inputs.md
    role: input-data
    download: true
    description: 공격성 입력 2건(다른 사람의 개인정보 요구, 숨은 지시문). D2-4에서 Project 새 대화에 붙여 실행합니다.
  - path: instructor-notes.md
    role: other
    download: false
    description: 강사용 설명(개인정보 행, 확인 필요 6건과 이유, 기대 분류표 30건, 초안 연습 5건, 공격성 입력 처리, 강의 준비)
