# 과정 구조의 단일 원천 (COURSE_MAP 데이터)
# - 시간·교시·학습목표·산출물·6요소·카드 배치·막힘 지점은 이 파일에만 적는다.
# - docs/COURSE_MAP.md는 설계 근거만 설명하고 수치를 적지 않는다.
# - 검증: python scripts/validate_course.py
# - ID는 한번 정하면 바꾸지 않는다 (CLAUDE.md CRITICAL 3).
# - status(planned|draft|reviewed)와 reviewed_hash는 교시·카드 모두 이 파일에만 둔다(ADR-011).
#   AI step은 자기 교시·카드의 status만 draft로 바꾼다. reviewed와 reviewed_hash는 npm run review:approve만 쓴다.

course:
  title: 공무원을 위한 하네스 엔지니어링
  edition: 2026-draft
  level: 초급→중급
  audience: 국가직·지방직 일반 행정 공무원, 개인 ChatGPT Plus 사용자, 비개발자, 생성형 AI 초보 포함

constraints:
  total_hours: 14
  days: 2
  lessons_per_day: 7
  lesson_minutes: 50
  max_core_minutes: 40        # 교시당 핵심 활동 상한 (나머지는 버퍼·전환)
  min_element_coverage: 2     # 6요소 각각 최소 몇 교시에서 다루는가
  max_cards_per_lesson: 2     # 초과 시 경고
  max_core_cards: 14          # core 카드 총량 상한 (초과 시 경고)
  freshness_days: 90          # 제품 정보·출처 확인일 경과 경고 기준

elements:
  instructions: ① 지침
  context: ② 근거
  tools: ③ 도구
  evals: ④ 검증
  guardrails: ⑤ 안전장치
  observability: ⑥ 기록

# 제안서의 교과목 7개 (lesson.subject가 참조)
subjects:
  S1: 하네스 엔지니어링 이해와 ChatGPT 기초
  S2: 지침 설계와 내 업무 비서 제작
  S3: 근거 자료 구축
  S4: 검증과 개선 루프
  S5: 구글 폼을 이용한 업무 처리(도구)
  S6: 안전장치와 기록
  S7: 내 업무 하네스 프로젝트

# 지원 방식 9종 (stuck_points.supports가 참조)
supports:
  1: 복붙 Prompt Card
  2: 대괄호 수정 Prompt Card
  3: 예시 입력
  4: 예상 결과
  5: 잘못된 결과 예시
  6: "\"AI에게 이렇게 물어보세요\" 도움말"
  7: 강사 시연
  8: 문제 해결 Prompt
  9: 체크리스트

activity_kinds: [admin, explain, demo, follow, practice, check, reflect]

completion:
  required_outputs:
    - 하네스 설계서 1장(6요소)
    - 지침과 근거를 넣은 ChatGPT Project 2개(민원 답변 비서, 내 업무)
    - 평가 점수 전/후 기록
    - 로그 대장
    - 적용 로드맵
  optional_outputs:
    - 업무용 구글 폼
  participation:
    - 점검표 12항목 짝 상호평가 참여
  self_check:
    - 프롬프트, 컨텍스트, 하네스의 차이를 내 업무 예시로 설명할 수 있다
    - 내 업무의 지침서 5항목을 작성할 수 있다
    - AI 답변이 틀렸을 때 원인이 지침인지 근거인지 구분할 수 있다
    - 평가 문항과 채점 기준을 만들어 점수로 개선을 확인할 수 있다
    - AI에게 맡기면 안 되는 일과 사람이 검토할 지점을 정할 수 있다

# 카드 status·reviewed_hash도 여기에만 둔다(ADR-011). 카드 파일에는 상태를 쓰지 않는다.
cards:
  - {id: card-guideline-critique, lesson: d1-guideline, title: 내 지침에서 애매한 곳 찾기, category: C, level: 1, where: new-chat, track: core, status: draft}
  - {id: card-source-rule-snippet, lesson: d1-context, title: 출처 규칙 지침 문장, category: D, level: 2, where: instructions, track: core, status: reviewed, reviewed_hash: "sha256:c7e812fe0fa55a6d07868d8e1fc6956c22576344b25fcdae03252c5f082857b4"}
  - {id: card-eval-question-critique, lesson: d1-evalset, title: 내가 쓴 평가 문항 비판받기, category: E, level: 2, where: new-chat, track: core, status: planned}
  - {id: card-batch-grading, lesson: d1-eval-run, title: 받은 답 채점(Project 밖), category: E, level: 1, where: temporary-chat, track: core, status: planned}
  - {id: card-failure-cause, lesson: d1-improve, title: 오답 원인 분석, category: E, level: 2, where: project-chat, track: core, status: planned}
  - {id: card-classify-attachment, lesson: d2-batch-classify, title: 첨부한 접수 표 분류·요약, category: B, level: 2, where: project-chat, track: core, status: planned}
  - {id: card-draft-replies, lesson: d2-drafts, title: 건별 답변 초안과 보고 요약, category: B, level: 2, where: project-chat, track: core, status: planned}
  - {id: card-risk-finder, lesson: d2-guardrails, title: 내 지침의 위험 찾기, category: F, level: 2, where: new-chat, track: core, status: planned}
  - {id: card-work-analysis, lesson: d2-project-design, title: 업무를 하네스 관점으로 분석, category: B, level: 2, where: new-chat, track: core, status: planned}
  - {id: card-design-to-guideline, lesson: d2-project-build, title: 설계서를 지침으로 옮기기, category: H, level: 3, where: new-chat, track: core, status: planned}
  - {id: card-improvement-finder, lesson: d2-wrapup, title: 내 하네스 개선점 찾기, category: H, level: 3, where: project-chat, track: core, status: planned}
  - {id: card-help-odd-result, lesson: common, title: 결과가 이상할 때 원인 찾기, category: A, level: 1, where: project-chat, track: core, status: planned}
  - {id: card-help-long-output, lesson: common, title: 출력이 끊기거나 너무 길 때, category: A, level: 1, where: project-chat, track: core, status: planned}
  - {id: card-help-broken-table, lesson: common, title: 표가 깨질 때, category: A, level: 1, where: project-chat, track: core, status: planned}

# 실습 키트 — 자료는 content/kits/<id>/(kit.yaml 필드는 docs/PRACTICE_CASES.md 1절).
# status·reviewed_hash도 여기에만 둔다(ADR-011). 해시는 키트 폴더 전체, 승인은 npm run review:approve <kit-id>.
kits:
  - {id: day1-civil, title: Day 1 전입신고 민원 답변 비서 키트, status: reviewed, reviewed_hash: "sha256:99502e06b42a0e56756e57c916e369060e3c1e9f87a5c22c8b24e5a7ac85c3f6"}

lessons:
  # ───────────────────────── Day 1 — 지침·근거·검증 (전입신고 민원 답변 비서)
  - id: d1-harness-intro
    day: 1
    number: 1
    title: 하네스 엔지니어링 이해
    type: concept
    subject: S1
    track: core
    status: reviewed
    reviewed_hash: "sha256:b64a8ea00af2ae395a5be5b044581226335cfe5d9d42af67bbc54992ffe6617a"
    elements: []
    overview: true
    activities:
      - {kind: admin, name: 입과 안내, minutes: 10}
      - {kind: follow, name: 같은 민원 질문 2회 입력 후 짝과 비교(로그인 확인 겸), minutes: 10}
      - {kind: explain, name: Prompt·Context·Harness 비교와 6요소 지도, minutes: 8}
      - {kind: practice, name: 비개인화 임시 채팅에서 기준 질문 5개를 묻고 표 양식에 답 붙여 넣기, minutes: 10}
      - {kind: check, name: 짝에게 한 문장 설명과 6요소 이름 적고 체크, minutes: 2}
    objectives:
      - {id: d1-01-o1, text: 같은 질문에도 AI 답이 달라지는 문제를 직접 확인하고 설명한다, outputs: [d1-01-p1], checks: [d1-01-c1, d1-01-c2]}
      - {id: d1-01-o2, text: Prompt·Context·Harness의 차이를 짝에게 설명하고 6요소의 이름을 적는다, outputs: [d1-01-p2], checks: [d1-01-c2, d1-01-c3]}
    outputs:
      - {id: d1-01-p1, text: 기준 질문 5개와 첫 답변 기록(하네스 대장), used_by: [d1-project]}
      - {id: d1-01-p2, text: 6요소 한 줄 메모(그림을 보지 않고 적은 6요소 이름), used_by: [d2-project-design]}
    checks:
      - {id: d1-01-c1, text: 기준 질문 5개와 답이 하네스 대장(또는 표 양식)에 기록되어 있다}
      - {id: d1-01-c2, text: 짝에게 같은 질문에 답이 달랐던 이유와 하네스가 필요한 이유를 한 문장으로 말했다}
      - {id: d1-01-c3, text: 6요소 이름을 그림을 보지 않고 적은 뒤 체크리스트에서 모두 체크했다}
    cards: []
    stuck_points:
      - {id: sp-d1-01-a, text: 어디에 입력하는지 모른다, supports: [7, 9]}
      - {id: sp-d1-01-b, text: 두 답변을 비교할 때 무엇을 봐야 할지 모른다, supports: [3, 9]}
      - {id: sp-d1-01-c, text: 기준 질문의 답을 기록할 곳이 없다, supports: [3, 9]}
      - {id: sp-d1-01-d, text: 비개인화 임시 채팅이 무엇인지 모른다, supports: [6, 7]}
    skip_if_short: [6요소 사례 설명, 답이 다른 예시 보기]

  - id: d1-guideline
    day: 1
    number: 2
    title: 업무 지침서 작성
    type: practice
    subject: S2
    track: core
    status: draft
    elements: [instructions]
    activities:
      - {kind: demo, name: 민원 업무 흐름과 AI·사람 역할 구분 시연, minutes: 7}
      - {kind: follow, name: v0 지침 함께 진단, minutes: 7}
      - {kind: practice, name: 지침서 5항목으로 v1 개선, minutes: 16}
      - {kind: check, name: AI에게 애매한 곳 비판받기, minutes: 7}
    objectives:
      - {id: d1-02-o1, text: 지침서 5항목(역할·범위·금지사항·출력 형식·모를 때 행동)으로 지침을 작성한다, outputs: [d1-02-p1], checks: [d1-02-c1, d1-02-c3]}
      - {id: d1-02-o2, text: 업무에서 AI가 맡을 일과 사람이 맡을 일을 구분한다, outputs: [d1-02-p1], checks: [d1-02-c2]}
    outputs:
      - {id: d1-02-p1, text: 지침서 v1(하네스 대장 지침 버전 탭), used_by: [d1-project]}
    checks:
      - {id: d1-02-c1, text: 지침서 5항목이 모두 채워져 있고 추상적 표현(친절하게 등)이 구체적으로 바뀌었다}
      - {id: d1-02-c2, text: 민원 업무 흐름의 단계마다 AI와 사람 중 누가 맡는지 표시했고 사람이 맡을 일이 지침의 금지사항이나 모를 때 행동에 적혀 있다}
      - {id: d1-02-c3, text: 하네스 대장(또는 표 양식)의 지침 버전에 v0 원문과 v1 전문이 바꾼 이유와 함께 기록되어 있다}
    cards: [card-guideline-critique]
    stuck_points:
      - {id: sp-d1-02-a, text: 업무를 AI에게 어떻게 설명할지 모른다, supports: [3, 7]}
      - {id: sp-d1-02-b, text: 범위와 금지사항을 구분하지 못하고 추상적으로 쓴다, supports: [5, 9]}
      - {id: sp-d1-02-c, text: 쓴 지침이 충분한지 판단하지 못한다, supports: [1, 4, 6], card: card-guideline-critique}
      - {id: sp-d1-02-d, text: AI가 제안한 문장을 모두 붙여 지침이 길어지고 자료에 없는 내용이 들어간다, supports: [5, 9]}
    skip_if_short: [AI 비판 단계]

  - id: d1-project
    day: 1
    number: 3
    title: ChatGPT Project로 비서 만들기
    type: practice
    subject: S2
    track: core
    status: draft
    elements: [instructions]
    activities:
      - {kind: demo, name: Project 개념과 만들기 시연, minutes: 7}
      - {kind: follow, name: Project 생성과 지침 입력, minutes: 8}
      - {kind: practice, name: 기준 질문 5개 재질문과 적용 전·후 비교, minutes: 16}
      - {kind: practice, name: 동료 공유(가능 시) 또는 빼보기 실험, minutes: 5}
    objectives:
      - {id: d1-03-o1, text: 지침을 Project에 넣어 매번 같은 규칙으로 답하게 만든다, outputs: [d1-03-p1], checks: [d1-03-c1]}
      - {id: d1-03-o2, text: 적용 전·후 답변을 비교해 지침의 효과를 설명한다, outputs: [d1-03-p2], checks: [d1-03-c2, d1-03-c3]}
    outputs:
      - {id: d1-03-p1, text: 민원 답변 비서 Project v1, used_by: [d1-context]}
      - {id: d1-03-p2, text: 적용 전·후 비교표, used_by: [d1-improve]}
    checks:
      - {id: d1-03-c1, text: Project 지침란에 지침서 v1 전문이 저장되어 있고 새 대화에서 질문만 넣어도 v1의 출력 형식대로 답한다}
      - {id: d1-03-c2, text: 5문항 중 형식·범위가 개선된 문항을 비교표에 표시했다}
      - {id: d1-03-c3, text: 지침으로 나아진 것과 아직 근거가 없는 것을 비교표 아래에 한 문장으로 적었다}
    cards: []
    stuck_points:
      - {id: sp-d1-03-a, text: 지침을 지침란이 아니라 채팅창에 붙여 넣는다, supports: [5, 7]}
      - {id: sp-d1-03-b, text: 전·후 답변의 차이를 찾지 못한다, supports: [4, 9]}
      - {id: sp-d1-03-c, text: 형식이 맞으면 금지사항을 어긴 답도 개선으로 표시한다, supports: [5, 9]}
    skip_if_short: [동료 공유]

  - id: d1-context
    day: 1
    number: 4
    title: 근거 자료 연결과 출처 답변
    type: practice
    subject: S3
    track: core
    status: reviewed
    reviewed_hash: "sha256:20fad6063f5393ed08d334cef523800e3bf3536a7a2c52033c897d6084e6ed09"
    elements: [context, guardrails]
    activities:
      - {kind: explain, name: 근거·출처·기준일, minutes: 5}
      - {kind: demo, name: 출처 없는 답과 출처 있는 답 비교 시연, minutes: 7}
      - {kind: follow, name: 자료 업로드와 출처 규칙 추가(막히면 본문 붙여넣기), minutes: 8}
      - {kind: practice, name: 자료 안·밖 질문 테스트, minutes: 12}
      - {kind: check, name: 자료 목록과 기준일 기록, minutes: 5}
    objectives:
      - {id: d1-04-o1, text: 규정 자료를 Project에 연결하고 출처(조문)를 밝혀 답하게 만든다, outputs: [d1-04-p1], checks: [d1-04-c1]}
      - {id: d1-04-o2, text: 자료에 없는 질문에 "확인 필요"로 답하게 만든다, outputs: [d1-04-p1], checks: [d1-04-c2]}
      - {id: d1-04-o3, text: 근거 자료의 목록과 기준일을 기록한다, outputs: [d1-04-p2], checks: [d1-04-c3]}
    outputs:
      - {id: d1-04-p1, text: 민원 답변 비서 Project v2(근거 연결), used_by: [d1-eval-run]}
      - {id: d1-04-p2, text: 자료 목록(시행일·기준일), used_by: [d1-improve]}
    checks:
      - {id: d1-04-c1, text: 자료 안 질문 3개가 조문 번호를 밝혀 답했고 그 조문이 내려받은 규정 파일에 실제로 있는지 확인했다}
      - {id: d1-04-c2, text: 자료 밖 질문 2개에 지어낸 내용 없이 "확인 필요"로 답했다}
      - {id: d1-04-c3, text: 하네스 대장(또는 표 양식)의 자료 목록에 올린 자료의 이름과 기준일이 기록되어 있다}
    cards: [card-source-rule-snippet]
    stuck_points:
      - {id: sp-d1-04-a, text: 파일만 올리고 지침에 출처 규칙을 넣지 않는다, supports: [2, 4], card: card-source-rule-snippet}
      - {id: sp-d1-04-b, text: 존재하지 않는 조문을 지어낸 답을 알아보지 못한다, supports: [5, 9]}
      - {id: sp-d1-04-c, text: 파일 업로드가 막힌다, supports: [8]}
      - {id: sp-d1-04-d, text: 자료 목록의 기준일에 무엇을 적을지 모른다, supports: [3, 9]}
    skip_if_short: [파일 형식 비교]

  - id: d1-evalset
    day: 1
    number: 5
    title: 평가세트 설계
    type: practice
    subject: S4
    track: core
    status: planned
    elements: [evals, guardrails]
    activities:
      - {kind: explain, name: 평가세트 먼저, minutes: 5}
      - {kind: demo, name: 채점 기준(문항당 1점) 시연, minutes: 5}
      - {kind: follow, name: 답변 2개 손채점, minutes: 10}
